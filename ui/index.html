<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pocket Search</title><link rel="stylesheet" href="style.css"><script type="module" src="app.mjs"></script></head>
<body><header><span class="edition">Pocket Search</span><button id="preview-open">本体プレビュー</button></header>
<main><section class="search-home" aria-label="検索"><h1>Pocket <span>Search</span></h1><form id="search-form" role="search"><label class="sr-only" for="query">検索語</label><div class="search-box"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 4 4"/></svg><input id="query" name="q" type="search" placeholder="検索語を入力" autocomplete="off" spellcheck="false" aria-describedby="notice"><button id="clear" type="button" aria-label="検索語を消す" hidden>×</button></div><button class="search-submit" type="submit">検索</button></form><p id="notice" role="status" aria-live="polite">オリジナルのサンプル記事を検索できます</p></section><section id="results" aria-label="検索結果" hidden><p id="result-status" role="status"></p><ol id="result-list"></ol><p id="empty" hidden>一致する記事がありません。検索語を変えてみてください。</p></section><article id="reader" aria-label="本文" hidden><button id="reader-back">検索結果へ戻る</button><p id="reader-source" class="result-source"></p><h2 id="reader-title"></h2><pre id="reader-text"></pre><nav aria-label="本文ページ"><button id="reader-prev">前のページ</button><span id="reader-page"></span><button id="reader-next">次のページ</button></nav></article></main>
<footer><span>独自検索 · サンプル記事</span><span>Chromatic · 160 × 144</span></footer>
<dialog id="preview"><div class="dialog-heading"><span>本体レイアウト案</span><button id="preview-close" aria-label="プレビューを閉じる">×</button></div><canvas id="screen" width="160" height="144" tabindex="0" aria-label="検索ホームのレイアウト案"></canvas><div class="controls"><div class="dpad"><button data-key="up" aria-label="上">↑</button><button data-key="left" aria-label="左">←</button><button data-key="right" aria-label="右">→</button><button data-key="down" aria-label="下">↓</button></div><div class="ab"><button data-key="b">B</button><button data-key="a">A</button></div></div><div class="small-controls"><button data-key="select">SELECT</button><button data-key="start">START</button></div><p class="hint">Aで文字入力 · Startで検索<br>Selectで文字種 · Bで削除／戻る</p><p class="scope">操作と配置のプレビューです。実機の映像ではありません。</p></dialog></body></html>
