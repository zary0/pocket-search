[package]
name = "pocket-search"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Independent web search and a bounded reader protocol for ModRetro Chromatic"
publish = false

[workspace]
members = ["crates/chromatic-client"]
resolver = "3"

[dependencies]
chromatic-client = { path = "crates/chromatic-client" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
