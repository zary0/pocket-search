[package]
name = "pocket-search"
version.workspace = true
edition = "2024"
rust-version = "1.85"
description = "Independent web search and a bounded reader protocol for ModRetro Chromatic"
license = "GPL-3.0-only"
repository = "https://github.com/zary0/pocket-search"
publish = false

[workspace]
members = ["crates/chromatic-client", "crates/chromatic-ffi"]
resolver = "3"

[workspace.package]
version = "0.1.0"

[dependencies]
chromatic-client = { path = "crates/chromatic-client" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[[bench]]
name = "performance"
harness = false

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
overflow-checks = true

[profile.chromatic-size]
inherits = "release"
opt-level = "s"
panic = "abort"
strip = "debuginfo"

[profile.chromatic-speed]
inherits = "release"
opt-level = 3
panic = "abort"
strip = "debuginfo"
