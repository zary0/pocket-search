[package]
name = "pocket-search"
version.workspace = true
edition = "2024"
rust-version = "1.88"
description = "Independent web search and a bounded reader protocol for ModRetro Chromatic"
license = "GPL-3.0-only"
repository = "https://github.com/zary0/pocket-search"
publish = false

[workspace]
members = ["crates/chromatic-client", "crates/chromatic-ffi"]
resolver = "3"

[workspace.package]
version = "0.14.7"

[dependencies]
chromatic-client = { path = "crates/chromatic-client" }
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls-webpki-roots"] }
robotstxt = "0.3"
scraper = { version = "0.27", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
url = { version = "2.5", default-features = false }

[[bench]]
name = "performance"
harness = false

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
overflow-checks = true

[profile.chromatic-size]
inherits = "release"
opt-level = "s"
panic = "abort"
strip = "debuginfo"

[profile.chromatic-speed]
inherits = "release"
opt-level = 3
panic = "abort"
strip = "debuginfo"
