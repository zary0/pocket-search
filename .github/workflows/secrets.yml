name: Secret scan
on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]
permissions:
  contents: read
jobs:
  secret-scan:
    name: secret-scan
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Obtain checksum-pinned official scanner
        shell: python
        run: |
          import hashlib, io, os, pathlib, tarfile, urllib.request
          url = "https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz"
          expected = "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
          data = urllib.request.urlopen(url, timeout=60).read()
          if hashlib.sha256(data).hexdigest() != expected:
              raise SystemExit("Scanner archive checksum mismatch")
          with tarfile.open(fileobj=io.BytesIO(data), mode="r:gz") as archive:
              member = archive.getmember("gitleaks")
              if not member.isfile():
                  raise SystemExit("Scanner member is not a regular file")
              binary = archive.extractfile(member).read()
          output = pathlib.Path(os.environ["RUNNER_TEMP"]) / "gitleaks"
          output.write_bytes(binary)
          output.chmod(0o700)
      - name: Scan source history with redacted diagnostics
        run: >-
          "$RUNNER_TEMP/gitleaks" git .
          --config .gitleaks.toml
          --log-opts="--all --full-history"
          --ignore-gitleaks-allow
          --redact --no-banner --no-color
          --max-target-megabytes=512 --max-archive-depth=3
          --report-format=json --report-path="$RUNNER_TEMP/secrets.json"
