name: CI
on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]
permissions:
  contents: read
jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          components: rustfmt, clippy
      - run: python3 scripts/pipeline.py version
      - run: python3 -m unittest discover -s tests -v
      - name: Check display transfer bounds
        run: |
          cc -std=c11 -Wall -Wextra -Werror -fsanitize=address,undefined tests/test_band_plan.c -o /tmp/test-band-plan
          /tmp/test-band-plan
          cc -std=c11 -Wall -Wextra -Werror -fsanitize=address,undefined -DPOCKET_BAND_ROWS=48 tests/test_band_plan.c -o /tmp/test-band-plan48
          /tmp/test-band-plan48
      - name: Check bounded search input
        run: |
          cc -std=c11 -Wall -Wextra -Werror -fsanitize=address,undefined tests/test_search_input.c -o /tmp/test-search-input
          /tmp/test-search-input
          node --test tests/test_search_input.mjs tests/test_pcs1.mjs tests/test_images.mjs
      - run: cargo fmt --all --check
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - run: cargo test --locked --workspace
      - run: cargo check --locked -p chromatic-client
      - run: cargo build --locked -p chromatic-client --profile chromatic-size
      - run: cargo build --locked -p chromatic-client --profile chromatic-speed
      - run: cargo bench --locked --bench performance --no-run
