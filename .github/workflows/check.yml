name: CI
on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]
permissions:
  contents: read
jobs:
  native-firmware:
    name: native-firmware
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install native build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y git wget flex bison gperf python3 python3-venv cmake ninja-build ccache libffi-dev libssl-dev dfu-util libusb-1.0-0
          python3 scripts/setup_chromatic_firmware.py "$RUNNER_TEMP/chromatic-tools"
      - name: Build the complete MCU application from this checkout
        run: |
          export IDF_TOOLS_PATH="$RUNNER_TEMP/chromatic-tools/idf-tools"
          source "$RUNNER_TEMP/chromatic-tools/idf/export.sh"
          python3 scripts/build_chromatic_firmware.py \
            --upstream "$RUNNER_TEMP/chromatic-tools/mcu" \
            --idf "$RUNNER_TEMP/chromatic-tools/idf" \
            --lvgl "$RUNNER_TEMP/chromatic-tools/lvgl" \
            --output "$RUNNER_TEMP/chromatic-firmware" \
            --cargo "$RUNNER_TEMP/chromatic-tools/rust/bin/cargo" \
            --rustc "$RUNNER_TEMP/chromatic-tools/rust/bin/rustc" \
            --idf-python "$IDF_PYTHON_ENV_PATH/bin/python"
      - name: Retain candidate identity (no physical qualification)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-build-${{ github.sha }}
          path: |
            ${{ runner.temp }}/chromatic-firmware/firmware.json
          if-no-files-found: error
          retention-days: 14
  ci:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          components: rustfmt, clippy
      - run: python3 scripts/pipeline.py version
      - run: python3 scripts/generate_chromatic_sources.py --check
      - run: python3 -m unittest discover -s tests -v
      - name: Install FPGA simulation tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y iverilog zlib1g-dev
      - name: Check out pinned official FPGA sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ModRetro/oss-chromatic-console-fpga
          ref: a01aa375147943cbcd4a41f41585220d55e0c28a
          path: target/chromatic-fpga-upstream
          submodules: recursive
          persist-credentials: false
      - name: Stage and elaborate native audio integration
        env:
          CLICK_STAGE: ${{ runner.temp }}/chromatic-click
        run: |
          python3 scripts/prepare_chromatic_click.py target/chromatic-fpga-upstream "$CLICK_STAGE"
          python3 scripts/test_chromatic_click.py --staged "$CLICK_STAGE"
      - name: Check display transfer bounds
        run: |
          cc -std=c11 -Wall -Wextra -Werror -fsanitize=address,undefined tests/test_band_plan.c -o /tmp/test-band-plan
          /tmp/test-band-plan
          cc -std=c11 -Wall -Wextra -Werror -fsanitize=address,undefined -DPOCKET_BAND_ROWS=48 tests/test_band_plan.c -o /tmp/test-band-plan48
          /tmp/test-band-plan48
      - name: Check bounded search input
        run: |
          cc -std=c11 -Wall -Wextra -Werror -fsanitize=address,undefined tests/test_search_input.c -o /tmp/test-search-input
          /tmp/test-search-input
          cc -std=c11 -Wall -Wextra -Werror -fsanitize=address,undefined tests/test_search_collection.c -o /tmp/test-search-collection
          /tmp/test-search-collection
          cc -std=c11 -Wall -Wextra -Werror -fsanitize=address,undefined -Itests/platform -Idevices/chromatic/components/pocket_search_ui tests/test_search_origin.c devices/chromatic/components/pocket_search_ui/pocket_search_origin.c -o /tmp/test-search-origin
          /tmp/test-search-origin
          cc -std=c11 -Wall -Wextra -Werror -fsanitize=address,undefined tests/test_resource_policy.c -o /tmp/test-resource-policy
          /tmp/test-resource-policy
          cc -std=c11 -Wall -Wextra -Werror -fsanitize=address,undefined tests/test_frame_capture.c -o /tmp/test-frame-capture
          /tmp/test-frame-capture
          cc -std=c11 -Wall -Wextra -Werror -fsanitize=address,undefined tests/test_jpeg_policy.c -o /tmp/test-jpeg-policy
          /tmp/test-jpeg-policy
          cc -std=c11 -Wall -Wextra -Werror -fsanitize=address,undefined tests/test_inline_image.c -o /tmp/test-inline-image
          /tmp/test-inline-image
          cc -std=c11 -Wall -Wextra -Werror -fsanitize=address,undefined -DPS_IMAGE_HOST -Itests/platform tests/test_extended_image.c devices/chromatic/components/pocket_search_ui/pocket_extended_image.c -lz -lm -o /tmp/test-extended-images
          /tmp/test-extended-images ci/native-fixture/bars.png ci/native-fixture/bars-progressive.jpg ci/native-fixture/palette.png
          node --test tests/test_search_input.mjs tests/test_pcs1.mjs tests/test_images.mjs tests/test_feedback.mjs
      - name: Check persistent flash record corruption and torn commits
        run: |
          cc -std=c11 -Wall -Wextra -Werror -fsanitize=address,undefined tests/test_store_format.c -o /tmp/pocket-store-format
          /tmp/pocket-store-format
      - run: cargo fmt --all --check
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - run: cargo test --locked --workspace
      - run: cargo check --locked -p chromatic-client
      - run: cargo build --locked -p chromatic-client --profile chromatic-size
      - run: cargo build --locked -p chromatic-client --profile chromatic-speed
      - run: cargo bench --locked --bench performance --no-run
