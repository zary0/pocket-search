name: CI
on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]
permissions:
  contents: read
jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          components: rustfmt, clippy
      - run: python3 scripts/pipeline.py version
      - run: python3 -m unittest discover -s tests -v
      - run: cargo fmt --all --check
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - run: cargo test --locked --workspace
      - run: cargo check --locked -p chromatic-client
      - run: cargo build --locked -p chromatic-client --profile chromatic-size
      - run: cargo build --locked -p chromatic-client --profile chromatic-speed
      - run: cargo bench --locked --bench performance --no-run
